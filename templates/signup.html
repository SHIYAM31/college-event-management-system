{% extends 'base.html' %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Student sign up</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Name <input name="name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Password (min 6 characters) <input type="password" name="password" minlength="6" required></label>
    <label>Department <input name="department" placeholder="e.g. CSE" required></label>
    <label>Year <select name="year"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
    <button class="btn">Create account</button>
  </form>
</div>
{% endblock %}
